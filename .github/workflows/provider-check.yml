# Check of aiduino/extension/out/config/providerConfigs.js
# - structure, ping and OpenRouter catalog checks (no API keys needed)
# - runs on pull requests and pushes that touch the config, and on demand
# - the weekly check and fixes are done by the scheduled task "AI.duino Provider-Config Wochencheck",
#   which runs testProviders.js itself and opens a PR; this workflow is the CI gate on that PR
name: Provider config check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aiduino/extension/out/config/providerConfigs.js'
      - 'aiduino/extension/out/config/testProviders.js'
      - '.github/workflows/provider-check.yml'
  pull_request:
    paths:
      - 'aiduino/extension/out/config/providerConfigs.js'
      - 'aiduino/extension/out/config/testProviders.js'
      - '.github/workflows/provider-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run provider tests
        working-directory: aiduino/extension/out/config
        run: node testProviders.js --ci --report "$RUNNER_TEMP/provider-report.md"

      - name: Job summary
        if: always()
        run: cat "$RUNNER_TEMP/provider-report.md" >> "$GITHUB_STEP_SUMMARY" || true
